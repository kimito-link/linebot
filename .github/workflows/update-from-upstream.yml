name: Update from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write
  pull-requests: write
# 注: `workflows` という permission キーは存在しない。GITHUB_TOKEN では
# .github/workflows/ 配下を push できない仕様で、permissions ブロックでは
# 回避できない（CIが自分でCIの定義を書き換えられると、任意コード実行を
# 自分に許可できてしまうため意図的に禁じられている）。
# 詳しくは下の「上流のworkflow変更は取り込まない」ステップのコメントを参照。

jobs:
  update:
    if: github.repository != 'Shudesu/line-harness-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Shudesu/line-harness-oss.git
          git fetch upstream main

      # 「取り込むべき上流の変更があるか」と
      # 「そのためのブランチを既に作ってあるか」は別の問いなので両方見る。
      #
      # 上流がmainに入っているかだけで判定すると、PRをマージするまで
      # 毎晩「未取り込みだ」と判断し、**中身がまったく同じブランチを
      # 1本ずつ積み続ける**。実際そうなっていて13本溜まった（2026-08-31）。
      # 差分ゼロのブランチが並んでも、判断材料は1本目以上には増えない。
      - name: Detect upstream changes
        id: detect
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "reason=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 既存の取り込みブランチが、いま取り込もうとしている上流地点を
          # 既にカバーしているなら、作り直す意味がない。
          target=$(git rev-parse upstream/main)
          for ref in $(git ls-remote --heads origin 'refs/heads/upstream/update-*' | cut -f2); do
            branch="${ref#refs/heads/}"
            git fetch -q origin "$ref:refs/remotes/pending/${branch#upstream/}" 2>/dev/null || continue
            if git merge-base --is-ancestor "$target" "refs/remotes/pending/${branch#upstream/}" 2>/dev/null; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "reason=already-prepared" >> "$GITHUB_OUTPUT"
              echo "pending=$branch" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "reason=new-upstream" >> "$GITHUB_OUTPUT"

      - name: Create update branch
        if: steps.detect.outputs.has_changes == 'true'
        id: branch
        run: |
          branch="upstream/update-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          # マージ前のこちら側を固定して覚えておく。
          # 後段で HEAD~1 / HEAD~2 と数えると、衝突の有無でコミット数が
          # 変わって指す先がズレる。SHAで持てばズレない。
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 衝突しても止めない。
      #
      # このリポジトリは2026-07-19に上流から分岐して以来、双方が独自に
      # 進んでいる(音声返信・出力ガード等はこちら固有)。衝突は例外ではなく
      # 常態であり、`git merge` の失敗でジョブを落とすと **毎晩必ず赤くなり、
      # PRも作られない**状態になる。実際2026-08-21〜30の10日間、
      # 連続でfailureのまま何も届いていなかった。
      #
      # 赤が鳴り続けると本当の失敗が埋もれるので、衝突は「異常」ではなく
      # 「人が解決すべき状態」として扱い、印を残したままPRにする。
      - name: Merge upstream/main
        if: steps.detect.outputs.has_changes == 'true'
        id: merge
        run: |
          if git merge --no-edit upstream/main; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            # ファイル名は commit する前に採る。commit 後は unmerged 状態が
            # 消えて --diff-filter=U が何も返さなくなるため。
            git diff --name-only --diff-filter=U > /tmp/conflicted-files.txt
            {
              echo "### 衝突したファイル"
              echo ""
              echo '```'
              cat /tmp/conflicted-files.txt
              echo '```'
            } > /tmp/conflicts.md
            # 衝突マーカーを含んだまま記録する。ここで解決を試みない
            # (機械が適当に片方を選ぶと、消えた変更に誰も気づけない)。
            git add -A
            git commit -m "chore: merge upstream/main (衝突あり — 人の解決が要る)"
          fi

      # 上流の .github/workflows/ 変更は取り込まない。
      #
      # GITHUB_TOKEN では workflow ファイルを push できない（2026-08-31 実測）:
      #   refusing to allow a GitHub App to create or update workflow
      #   `.github/workflows/deploy-cloudflare-admin.yml` without `workflows` permission
      # これは permissions ブロックでは解決できない仕様。回避するには
      # `workflow` scope 付きの PAT が要るが、そのために鍵を1本増やして
      # 管理し続けるのは割に合わない。
      #
      # しかも「CIの定義が自動で書き換わらない」のは安全側の性質でもある。
      # workflow は信頼されて実行されるので、中身を読まずに取り込むと
      # 何が動くようになるか分からない。
      #
      # そこで workflow の変更だけ元に戻し、何が来ていたかをPRに書く。
      # 必要なら人が手で移す。
      - name: Exclude upstream workflow changes
        if: steps.detect.outputs.has_changes == 'true'
        id: exclude
        env:
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          # BASE はマージ前のこちら側（SHAで固定）。そこと比べて
          # .github/workflows/ に差分があるものを全部拾う（変更・追加・削除）。
          changed=$(git diff --name-status "$BASE" HEAD -- .github/workflows/ || true)
          if [ -n "$changed" ]; then
            echo "excluded=true" >> "$GITHUB_OUTPUT"
            {
              echo "### 取り込まなかった上流のworkflow変更"
              echo ""
              echo "GITHUB_TOKENではworkflowファイルをpushできないため、以下は**元に戻してある**。"
              echo "必要なら手で移すこと（\`A\`=上流で新規追加 / \`M\`=変更 / \`D\`=削除）。"
              echo ""
              echo '```'
              echo "$changed"
              echo '```'
            } > /tmp/excluded.md

            # マージ前の状態に完全に戻す。
            #
            # `git checkout HEAD~1 -- .github/workflows/` だけでは足りない。
            # 上流にしか無いファイル（こちらに存在しないもの）は「復元元が
            # 無い」ので消えずに残り、またpushで弾かれる。実際に
            # publish-update-cli.yml で踏んだ（2026-08-31）。
            # そこでディレクトリごと消してから復元する。
            git rm -rq -- .github/workflows
            git checkout "$BASE" -- .github/workflows/
            git add -A -- .github/workflows
            git commit -qm "chore: 上流のworkflow変更を除外（GITHUB_TOKENでは push できないため）"

            # 本当に差分ゼロになったか確認する。残っていればここで落として
            # 気づけるようにする（pushで落ちるより原因が分かりやすい）。
            left=$(git diff --name-only "$BASE" HEAD -- .github/workflows/ || true)
            if [ -n "$left" ]; then
              echo "::error::workflowの除外に失敗した。残った差分: $left"
              exit 1
            fi
          else
            echo "excluded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push update branch
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        if: steps.detect.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
          EXCLUDED: ${{ steps.exclude.outputs.excluded }}
        run: |
          if [ "$CONFLICTED" = "true" ]; then
            title="chore: update from upstream (衝突あり)"
            {
              echo "上流 Shudesu/line-harness-oss の変更を取り込もうとしたが、**衝突した**。"
              echo ""
              echo "衝突マーカーを含んだままコミットしてある。**そのままマージしないこと。**"
              echo "手元にこのブランチを取得して解決し、force pushしてからマージする。"
              echo ""
              echo "解決する気がないなら、このPRは閉じてよい（次の実行でまた作られる）。"
              echo "取り込み自体をやめるなら、このworkflowのscheduleを外す。"
              echo ""
              cat /tmp/conflicts.md 2>/dev/null || true
            } > /tmp/body.md
          else
            title="chore: update from upstream"
            {
              echo "上流 Shudesu/line-harness-oss の変更を取り込む。**衝突なし。**"
              echo ""
              echo "マージすると既存のCloudflareデプロイworkflowが本番へ反映する。"
            } > /tmp/body.md
          fi
          # workflow変更を落としている場合は、それも本文に足す
          if [ "$EXCLUDED" = "true" ]; then
            { echo ""; cat /tmp/excluded.md; } >> /tmp/body.md
            title="$title ※workflow変更は除外"
          fi
          # PR作成に失敗してもジョブは落とさない。
          #
          # リポジトリ設定 default_workflow_permissions が read のとき、
          # gh pr create は次で失敗する（2026-08-31 実測）:
          #   GraphQL: Resource not accessible by integration (createPullRequest)
          #
          # これを解くにはリポジトリ既定を write に上げることになるが、
          # そうすると**このリポジトリの全workflowの既定権限が上がる**。
          # 上流取り込みという補助的な機能のために、恒久的に権限を広げるのは
          # 割に合わない（一度広げた権限は、たいてい誰も狭めない）。
          #
          # ブランチはpush済みなので成果は失われていない。人が手でPRを
          # 作れる。だからここは「失敗」ではなく「人に引き渡す」で終える。
          if gh pr create --base main --head "${{ steps.branch.outputs.name }}" \
               --title "$title" --body-file /tmp/body.md; then
            echo "PRを作成した。"
          else
            {
              echo "### PRは自動作成できなかった"
              echo ""
              echo "ブランチは push 済み: \`${{ steps.branch.outputs.name }}\`"
              echo ""
              echo "リポジトリ設定 \`default_workflow_permissions\` が \`read\` のため、"
              echo "ActionsからPRを作れない。**取り込み自体は成功している。**"
              echo ""
              echo "手でPRを作るなら:"
              echo ""
              echo '```bash'
              echo "gh pr create --repo ${{ github.repository }} --base main \\"
              echo "  --head ${{ steps.branch.outputs.name }} --title '$title' --web"
              echo '```'
              echo ""
              echo "取り込む気がないなら、ブランチを消してよい:"
              echo ""
              echo '```bash'
              echo "git push origin --delete ${{ steps.branch.outputs.name }}"
              echo '```'
              echo ""
              echo "毎晩これが出るのが煩わしければ、このworkflowの \`schedule:\` を外して"
              echo "\`workflow_dispatch\` だけにする（必要なときに手で回す）。"
              echo ""
              cat /tmp/body.md
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PRは作れなかったが、ブランチ ${{ steps.branch.outputs.name }} は push 済み。詳細はこの実行のSummaryを参照。"
          fi

      # 未処理のブランチが静かに溜まるのを防ぐ。
      #
      # PRが自動で作られない構成なので、放っておくと upstream/update-* が
      # 毎晩1本ずつ増え、誰も見ないまま積み上がる（実際2026-07-27〜30の
      # 4本が未処理のまま残っていた）。溜まっていることを毎回言う。
      #
      # ここでも赤くしない。溜まっているのは「壊れている」ではなく
      # 「判断が保留されている」状態なので、warningで十分。
      - name: Report pending upstream branches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches=$(gh api "repos/${{ github.repository }}/branches" --paginate \
            -q '.[] | select(.name | startswith("upstream/update-")) | .name' 2>/dev/null | sort || true)
          count=$(echo "$branches" | grep -c . || true)
          if [ "${count:-0}" -gt 0 ]; then
            {
              echo ""
              echo "### 未処理の上流取り込みブランチ: ${count}本"
              echo ""
              echo '```'
              echo "$branches"
              echo '```'
              echo ""
              echo "見るつもりが無いものは消してよい:"
              echo ""
              echo '```bash'
              echo "$branches" | sed 's|^|git push origin --delete |'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$count" -ge 5 ]; then
              echo "::warning::上流取り込みブランチが ${count}本 溜まっている。処理するか消すか決めること。"
            fi
          fi

      # 「作らなかった」理由を区別して出す。
      # up-to-date と already-prepared を同じ文言にすると、
      # 「取り込み待ちのブランチがある」ことが見えなくなる。
      - name: No upstream changes
        if: steps.detect.outputs.has_changes == 'false'
        env:
          REASON: ${{ steps.detect.outputs.reason }}
          PENDING: ${{ steps.detect.outputs.pending }}
        run: |
          if [ "$REASON" = "already-prepared" ]; then
            {
              echo "### 新しいブランチは作らなかった"
              echo ""
              echo "取り込むべき上流の変更はあるが、**それを含むブランチが既にある**:"
              echo ""
              echo "- \`$PENDING\`"
              echo ""
              echo "同じ内容のブランチを増やしても判断材料は増えないので作らない。"
              echo "上のブランチを処理する（マージするか消すか）と、次の実行から再開する。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "取り込み待ちのブランチが既にある: $PENDING"
          else
            echo "Fork is already up to date with upstream/main."
          fi

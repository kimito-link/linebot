name: Update from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository != 'Shudesu/line-harness-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Shudesu/line-harness-oss.git
          git fetch upstream main

      - name: Detect upstream changes
        id: detect
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create update branch
        if: steps.detect.outputs.has_changes == 'true'
        id: branch
        run: |
          branch="upstream/update-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Merge upstream/main
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          # This fork intentionally carries local customizations. When upstream
          # changes touch the same hunk, preserve the fork's version while still
          # importing every non-conflicting upstream change and recording the
          # upstream commit as merged. This prevents the scheduled sync from
          # failing forever on the same expected fork conflicts.
          git merge -X ours --no-edit upstream/main

      - name: Push update branch
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        if: steps.detect.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url="$(gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore: update from upstream" \
            --body "This PR imports the latest Shudesu/line-harness-oss main into this fork. Conflicting hunks are resolved in favor of this fork's existing customizations; non-conflicting upstream changes are still imported. Existing CI should validate the merged result before integration.")"
          echo "Created $pr_url"
          # If auto-merge is enabled for this repository, merge only after the
          # repository's required checks pass. If it is unavailable, leave the
          # validated PR open rather than turning a maintenance sync into a hard failure.
          gh pr merge --auto --merge "$pr_url" || echo "Auto-merge unavailable; PR left open for the controller to evaluate."

      - name: No upstream changes
        if: steps.detect.outputs.has_changes == 'false'
        run: echo "Fork is already up to date with upstream/main."

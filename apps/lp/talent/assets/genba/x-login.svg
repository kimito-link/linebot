<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d">
  <title id="t">Xでログインするだけ</title>
  <desc id="d">ファンの方はXのアカウントでそのまま入れる。新しいIDやパスワードは作らない。</desc>
  <!-- ★kimitolink-linktree の「ログインすると、もうこのページが出来ています」を
       静的な図にしたもの（2026-09-01）。
       向こうはスクロールで追体験させるReactの部品で、実際のページをiframeで見せている。
       このLPは素のHTML1枚・JS0行なので、同じ仕掛けは持ち込めない。
       ★持ってくるのは**一番大事な事実**だけ:
         ファンの方がすることは「Xで続ける」を押すことだけ。
         新規登録も、パスワードを決めることもない。 -->

  <rect x="10" y="14" width="300" height="172" rx="10" fill="#fff" stroke="#E4DACF" stroke-width="1.5"/>

  <!-- スマホの枠 -->
  <rect x="112" y="30" width="96" height="140" rx="13" fill="#FBFCFD" stroke="#3A3532" stroke-width="2.4"/>

  <!-- Xのマーク -->
  <circle cx="160" cy="72" r="17" fill="#16181C"/>
  <!-- ★Xのロゴ形。ただの「✕」だと別物に見えるので、実物の字形に寄せる
       （太さが上下で変わり、右上と左下が尖る）。2026-09-01 実測で直した。 -->
  <path d="M 154.2 64.4 L 159.6 71.6 L 153.9 79.6 L 155.6 79.6 L 160.4 72.9
           L 165.4 79.6 L 170.0 79.6 L 164.2 71.9 L 169.6 64.4 L 167.9 64.4
           L 163.4 70.6 L 158.8 64.4 Z" fill="#fff"/>

  <!-- 説明の行 -->
  <text x="160" y="104" text-anchor="middle"
        font-family="'Hiragino Sans', system-ui, sans-serif" font-size="8" fill="#746C65">いつものアカウントで</text>

  <!-- ★ボタン。ここを押すだけ、というのがこの図の全部 -->
  <rect x="128" y="114" width="64" height="21" rx="10.5" fill="#40614F"/>
  <text x="160" y="128" text-anchor="middle"
        font-family="'Hiragino Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#fff">Xで続ける</text>

  <!-- 押したあと -->
  <text x="160" y="152" text-anchor="middle"
        font-family="'Hiragino Sans', system-ui, sans-serif" font-size="7.5" fill="#9A8F84">これだけで参加できます</text>

  <!-- 左右に「やらないこと」を置く。取り消し線で示す -->
  <g font-family="'Hiragino Sans', system-ui, sans-serif" font-size="9" fill="#B0A498">
    <text x="30" y="74">新規登録</text>
    <text x="30" y="98">パスワード</text>
    <text x="30" y="122">メール確認</text>
  </g>
  <g stroke="#C9A2A2" stroke-width="1.6" stroke-linecap="round">
    <path d="M 27 71 L 76 71"/>
    <path d="M 27 95 L 84 95"/>
    <path d="M 27 119 L 84 119"/>
  </g>

  <!-- 右: 入ったらもう出来ている -->
  <g font-family="'Hiragino Sans', system-ui, sans-serif" fill="#40614F">
    <text x="228" y="88" font-size="9.5" font-weight="700">入ったら、</text>
    <text x="228" y="104" font-size="9.5" font-weight="700">もうページが</text>
    <text x="228" y="120" font-size="9.5" font-weight="700">出来ています</text>
  </g>
</svg>

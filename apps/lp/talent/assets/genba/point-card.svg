<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d">
  <title id="t">紙のポイントカード</title>
  <desc id="d">30個のマス目が並んだ紙のカード。数マスだけ印が付いている。</desc>
  <!-- ★イメージ図。実在のカードの再現ではない。LPの配色に合わせている。
       ★ここに CSS変数名（ハイフン2つで始まる名前）を書かないこと。
         XMLのコメントは「ハイフン2つ」を含められない決まりで、書くとファイル全体が
         パースエラーになり、画像がまるごと表示されなくなる（2026-09-01 実際に踏んだ）。
         ブラウザは黙って壊れた画像アイコンを出すだけで、理由を教えてくれない。 -->
  <rect x="10" y="14" width="300" height="172" rx="10" fill="#fff" stroke="#E4DACF" stroke-width="1.5"/>

  <!-- 見出しの帯（文字は入れない。イメージなので） -->
  <rect x="26" y="30" width="96" height="7" rx="3.5" fill="#DED3C8"/>
  <rect x="26" y="43" width="60" height="6" rx="3" fill="#E8DFD6"/>

  <!-- 30マス（10列 × 3段） -->
  <g fill="none" stroke="#D8C9BB" stroke-width="1.4">
    <!-- 1段目 -->
    <rect x="26"  y="62" width="24" height="24" rx="5"/>
    <rect x="54"  y="62" width="24" height="24" rx="5"/>
    <rect x="82"  y="62" width="24" height="24" rx="5"/>
    <rect x="110" y="62" width="24" height="24" rx="5"/>
    <rect x="138" y="62" width="24" height="24" rx="5"/>
    <rect x="166" y="62" width="24" height="24" rx="5"/>
    <rect x="194" y="62" width="24" height="24" rx="5"/>
    <rect x="222" y="62" width="24" height="24" rx="5"/>
    <rect x="250" y="62" width="24" height="24" rx="5"/>
    <rect x="278" y="62" width="24" height="24" rx="5"/>
    <!-- 2段目 -->
    <rect x="26"  y="92" width="24" height="24" rx="5"/>
    <rect x="54"  y="92" width="24" height="24" rx="5"/>
    <rect x="82"  y="92" width="24" height="24" rx="5"/>
    <rect x="110" y="92" width="24" height="24" rx="5"/>
    <rect x="138" y="92" width="24" height="24" rx="5"/>
    <rect x="166" y="92" width="24" height="24" rx="5"/>
    <rect x="194" y="92" width="24" height="24" rx="5"/>
    <rect x="222" y="92" width="24" height="24" rx="5"/>
    <rect x="250" y="92" width="24" height="24" rx="5"/>
    <rect x="278" y="92" width="24" height="24" rx="5"/>
    <!-- 3段目 -->
    <rect x="26"  y="122" width="24" height="24" rx="5"/>
    <rect x="54"  y="122" width="24" height="24" rx="5"/>
    <rect x="82"  y="122" width="24" height="24" rx="5"/>
    <rect x="110" y="122" width="24" height="24" rx="5"/>
    <rect x="138" y="122" width="24" height="24" rx="5"/>
    <rect x="166" y="122" width="24" height="24" rx="5"/>
    <rect x="194" y="122" width="24" height="24" rx="5"/>
    <rect x="222" y="122" width="24" height="24" rx="5"/>
    <rect x="250" y="122" width="24" height="24" rx="5"/>
    <rect x="278" y="122" width="24" height="24" rx="5"/>
  </g>

  <!-- ★押された印は最初の4つだけ。「まだ途中」が伝わる -->
  <g fill="#59786B" opacity="0.5">
    <circle cx="38"  cy="74" r="7"/>
    <circle cx="66"  cy="74" r="7"/>
    <circle cx="94"  cy="74" r="7"/>
    <circle cx="122" cy="74" r="7"/>
  </g>

  <!-- 下の注記（線で表現。文字は入れない） -->
  <rect x="26" y="158" width="180" height="5" rx="2.5" fill="#E5DBD1"/>
  <rect x="26" y="169" width="130" height="5" rx="2.5" fill="#E5DBD1"/>
</svg>
